# Experiment tree: every model variant tried, as one node per variant.
#
# Edit this file, then run `python research_tree/render.py` to validate it and
# rebuild research_tree/tree.html (`--text` prints the tree in the terminal).
#
# Nodes form a FLAT list; the tree comes from `parent`. To add a variant, append
# a node at the end (or anywhere; siblings are drawn in file order) whose
# `parent` is the id of the variant it was derived from.
#
# Fields (only id, title, status are required):
#   id       unique slug. Convention: <package>.<short-name>[.<short-name>...]
#   parent   id of the node this variant changes. Omit for a root (one root per
#            model package under models/).
#   title    short name shown on the card.
#   status   ref     reference / starting configuration
#            win     improvement worth keeping
#            mixed   no clear change, or helps some sets and hurts others
#            fail    worse than its parent / dead end
#            running training or evaluation in progress
#            idea    proposed, not run yet
#            dropped abandoned or never finished; no result
#   date     YYYY-MM-DD the run (or idea) started.
#   change   what differs from the parent, in one or two sentences.
#   fwd      headline number (see meta.metric). Leave out if not evaluated.
#   coll     collision % on the same test set.
#   result   other numbers: seeds, other test sets, other envs, probe variants.
#   notes    interpretation, hypotheses, caveats (multi-line ok).
#   runs     list of paths: Experiments/... run folders, results/... outputs.
#   code     files or packages that implement the variant.

meta:
  title: Model experiment tree
  metric: >-
    fwd = forward-MPPI success % on Tshape3d_env1, standard 1k test set
    (offset 0.02); coll = collision % on that set. 4000 epochs unless noted.
  reference: metric_baseline   # its fwd is drawn as a tick on every bar

nodes:

  # ---------------------------------------------------------------- metric_baseline
  - id: metric_baseline
    title: metric NTFields baseline (isotropic Eikonal)
    status: ref
    date: 2026-10-06
    change: >-
      Original metric NTFields: single-route network, isotropic Eikonal on the
      combined speed.npy, residual 1e-2*(sqrt(S|grad tau|)-1)^2. TD and normal
      losses switched off.
    fwd: 77.7
    coll: 13.0
    result: >-
      3 seeds 77.7 ± 1.5 (non-convergence 17.0). Lshape3d_env3 88.0,
      Ashape3d_env4 87.1 (1 seed each). Farthest-pair set only 33.8: fails
      mostly by not converging at long range. Rerun 2026-10-09 on the new
      machine (2 seeds): 82.1 / 80.3, suite mean of 8 sets 59.2 ± 1.7; strongest
      on rotation-heavy (82-87%), weakest on farthest / big angles (46 / 42% with
      twist-sampling MPPI) (Experiments/3dshape_metric_baseline/Tshape3d_env1_metric_baseline_s{1,2},
      results/compare/plan/metric_s{1,2}*). 2026-10-10 (plan_eval, standard sets): T s3 82.1 (3 seeds 82.1 +- 0.4);
      Lshape3d_env3 90.4 / 87.7 / 91.6, Ashape3d_env4 86.4 / 88.9 / 85.9
      (Experiments/3dshape_metric_baseline/{L,A}*_metric_baseline_s{1,2,3}, results/compare/plan/{L,A}*_metric_s*).
      T s4 / s5 = epoch-4000 checkpoints of the 10000-epoch runs (metric_baseline.e10k): 82.2 / 81.1, so 5 seeds
      81.9 +- 0.5, collision 11.3.
    notes: |
      tau(start, goal) rank-correlates with realised path cost at only 0.55 on
      the farthest pairs (lie 0.71), and tau(waypoint, goal) rises along 18% of
      executed steps there. Poor cost-to-go at long range.
    runs:
      - Experiments/3dshape_metric_baseline/Tshape3d_env1_metric_baseline
      - results/output_3d/Tshape3d_env1_metric_baseline_final
      - results/compare/summary.md
    code: [models/metric_baseline/]

  - id: metric_baseline.pretrained
    parent: metric_baseline
    title: Pretrained checkpoint
    status: ref
    change: pretrained/Tshape3d_env1.pt evaluated as-is.
    fwd: 84.1
    result: either-direction 95.7, Alternative Bellman 91.9.
    notes: |
      Not a metric_baseline network (checked 2026-10-10): its state dict is the
      two_route architecture (encoder_t / encoder_r / gate / fuse), which
      metric_baseline cannot load. It is the README's 10000-epoch checkpoint from
      the repo's default trainer at the time; the loss it was trained with is not
      recorded. Do not read 84.1 as a metric_baseline result.
    runs:
      - pretrained/Tshape3d_env1.pt
      - results/output_3d/Tshape3d_env1_baseline_pretrained

  - id: metric_baseline.no_sqrt
    parent: metric_baseline
    title: No sqrt in residual
    status: mixed
    date: 2026-10-07
    change: Drop the sqrt from the residual mapping.
    fwd: 75.3
    result: 76.3 for the same seed with sqrt (same evaluation).
    notes: |
      Removing sqrt barely hurts the isotropic baseline, so the large effect on
      lie_metric interacts with its higher S_t / S_r targets. Checkpoints were
      in a session scratchpad, not in the repo.

  - id: metric_baseline.torch22
