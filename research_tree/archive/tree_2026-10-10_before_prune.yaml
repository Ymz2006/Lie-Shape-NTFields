      - results/compare/plan/metric_t22_s*
    code: [Dockerfile.server]

  - id: metric_baseline.full
    parent: metric_baseline
    title: TD + normal losses on (original metric NTFields)
    status: mixed
    date: 2026-10-10
    fwd: 79.1
    coll: 16.9
    change: >-
      Both losses metric_baseline switches off are back at the original weights:
      TD loss 1e-3 and normal-alignment loss 1e-3 (--td-weight 1e-3
      --normal-weight 1e-3). Alpha stays 1.0 (1.025 NaNs on the 3-D shape speeds).
    result: >-
      plan_eval forward MPPI, 3 seeds each. Tshape3d_env1 78.3 / 82.6 / 76.5 = 79.1 +- 3.1, collision 16.9
      (bare 82.1 +- 0.4, collision 11.1); suite mean of 9 T sets 57.7 (bare 60.9); worse than bare on every
      T set. Lshape3d_env3 90.4 +- 3.7 (bare 89.9); Ashape3d_env4 88.5 +- 1.3 (bare 87.1), with its clearest
      gain on A's far tight sets (exp2 64.5 vs 59.2, exp3 62.3 vs 56.2). 0-5 rejected epochs per run.
      With 2 more T seeds (the epoch-4000 checkpoints of the 10000-epoch runs, same procedure since LR is
      fixed): 78.3 / 82.6 / 76.5 / 78.6 / 81.0 = 79.4 +- 2.4, collision 16.7 (bare 5 seeds 81.9 +- 0.5,
      collision 11.3); 9-set mean 58.3 (bare 61.0).
    notes: |
      The bare baseline in the lie_metric_rnl report is not handicapped on T-shape: restoring the original
      losses lowers it. The TD term is what hurts (metric_baseline.td); the normal term alone is neutral
      (metric_baseline.normal) and mostly cancels the TD damage when both are on. With both on, the
      Eikonal term itself fits worse (2.30e-3 vs 2.0e-3 at epoch ~1150). Checkpoint ValLoss is the total
      (Eikonal + normal + TD), about 4.7e-3 at epoch 1150 vs 2.0e-3 bare.
    runs:
      - Experiments/3dshape_metric_baseline/{T,L,A}*_metric_full_s{1,2,3}
      - results/compare/plan/metricfull_s*, results/compare/plan/{L,A}*_metricfull_s*
    code: [models/metric_baseline/model_function_metric.py, models/metric_baseline/model_train_metric.py, train/train_3dshape.py]

  - id: metric_baseline.normal
    parent: metric_baseline
    title: Normal-alignment loss only
    status: mixed
    date: 2026-10-10
    fwd: 79.7
    coll: 9.8
    change: Normal-alignment loss at 1e-3 (--normal-weight 1e-3), TD loss off.
    result: >-
      2 seeds 82.4 / 76.9 (bare 82.1 +- 0.4); fewest collisions of the variants (9.8 vs 11.1 bare);
      suite mean of 9 T sets 61.1 (bare 60.9). No rejected epochs.
    runs:
      - Experiments/3dshape_metric_baseline/Tshape3d_env1_metric_normal_s{1,2}
      - results/compare/plan/metricnormal_s*
    code: [models/metric_baseline/model_function_metric.py]

