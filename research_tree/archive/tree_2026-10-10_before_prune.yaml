  # ---------------------------------------------------------------- lie_twist
  - id: lie_twist
    title: Body-twist optimal control, shape twist metric
    status: fail
    date: 2026-10-08
    change: >-
      Riemannian Eikonal from body-twist optimal control (image (7).png):
      gdot = g xi^, xi^T G(g) xi <= 1, HJB gives sqrt(p_b^T G^{-1} p_b) = 1/S,
      p_b = left-trivialized gradient (body R^T dtau/dp, Jr^{-T} dtau/dr).
      G(g) = D^{-1} G0 D^{-1}, D = diag(S_dist I, S_angle I), S = 1, where
      xi^T G0 xi = mean squared surface-point speed of the T under xi (exact
      mesh moments). Residual (sqrt(N)-1)^2, two_route network.
    fwd: 54.6
    coll: 37.1
    result: >-
      2 seeds 52.1 / 57.2 (non-convergence 16.6 vs 7.8 for lie_metric.sqrt rerun
      73.3 = 67.5 / 79.1 in the same evaluation). plan_eval suite, mean of 8 sets:
      39.1 vs lie sqrt 54.0; worse on every set, including translation-only
      (50.5 vs 57.0). Paired McNemar vs lie sqrt, standard 1k: 178 only-twist /
      530 only-lie, p = 2e-41; big angles 23.3 vs 45.0 (p = 2e-13).
    notes: |
      With G0 = I this is lie_metric exactly (checked: 3.6e-15), so the twist
      derivation alone changes nothing for the current block-isotropic metric;
      the new content is G0. For the T, G0's rotation block (per turn^2) has
      eigenvalues 0.20 / 0.44 / 0.61 about body z / x / y (lie_metric: 1), and
      v-w coupling 2pi*0.052 = 0.32 because the body origin (bbox centre) is
      0.052 from the surface centroid. p_b matches finite differences (1.6e-6);
      on T = |log(g_g^{-1} g)|_G0 the residual tends to 1 as O(s^2), while
      a world-frame translation gradient stays ~0.5 off.
      The field does learn G0: free-space tau slopes per turn about body x/y/z
      are 0.47-0.52 / 0.56-0.60 / 0.27-0.28 (target 0.66 / 0.78 / 0.44; lie_metric
      learns ~0.8 on all three), so rotation about the T's thin axis is ~3x
      cheaper than in lie_metric. Twist paths rotate more (geodesic rotation /
      straight 1.87 vs 1.47 on cases both solve), take 79 vs 56 MPPI iterations
      and pass closer to obstacles (min clearance 0.0137 vs 0.0181); the gap
      grows with the required rotation (135-180 deg: 41% vs 69%). The
      shape_scaled child (lie_metric's rotation scale, same structure) recovers
      most of the gap, so the main cause is the cheaper overall rotation price.
      The remaining gap may come from S_angle being one isotropic min-angle
      clearance, which G0 then cheapens about the thin axis even when that axis
      is blocked (unverified).
      Follow-up (2026-10-09): the image's own structure (scalar S, constant G,
      lie_twist.iso) with the worst-case metric (lie_twist.iso.max) and a
      planner that samples the twist control set (lie_twist.mppi_twist) is the
      best twist variant; see those nodes. Per-seed tables:
      results/compare/twist_seed_stats.json.
    runs:
      - Experiments/3dshape_lie_twist/Tshape3d_env1_lie_twist_rsqrtN_s1
      - Experiments/3dshape_lie_twist/Tshape3d_env1_lie_twist_rsqrtN_s2
      - results/output_3d/Tshape3d_env1_lie_twist_rsqrtN_s1
      - results/output_3d/Tshape3d_env1_lie_twist_rsqrtN_s2
      - results/compare/plan/twist_rsqrtN_s1
      - results/compare/plan/twist_rsqrtN_s2
      - results/compare/metric_probe
    code: [models/lie_twist/, train/train_3dshape.py, analysis/plan_eval.py]

