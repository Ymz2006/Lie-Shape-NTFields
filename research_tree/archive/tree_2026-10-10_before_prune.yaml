    result: >-
      2 seeds 67.0 / 59.1, collision 35.2 (bare 82.1, 11.1); suite mean of 9 T sets 42.1 (bare 60.9).
      23-27 rejected epochs per run (bare 0-1). Eikonal term 2.76e-3 at epoch ~1150 vs 2.0e-3 bare.
    runs:
      - Experiments/3dshape_metric_baseline/Tshape3d_env1_metric_td_s{1,2}
      - results/compare/plan/metrictd_s*
    code: [models/metric_baseline/model_function_metric.py]

  - id: metric_baseline.full.e10k
    parent: metric_baseline.full
    title: TD + normal, 10000 epochs
    status: win
    date: 2026-10-10
    fwd: 84.2
    coll: 12.2
    change: metric_baseline.full trained for 10000 epochs instead of 4000 (the README's pretrained checkpoint length).
    result: >-
      2 seeds 83.6 / 84.8 (collision 12.5 / 11.9) vs 79.1 +- 3.1 at 4000 epochs; level with bare at
      10000 epochs (metric_baseline.e10k 84.2). Recorded loss at epoch 4000 4.23e-3 / 4.55e-3 (total incl.
      TD + normal). 8-12 rejected epochs over 10000.
    runs:
      - Experiments/3dshape_metric_baseline/Tshape3d_env1_metric_full10k_s{1,2}
      - results/compare/plan/metricfull10k_s*
    code: [models/metric_baseline/]

  - id: metric_baseline.e10k
    parent: metric_baseline
    title: 10000 epochs
    status: win
    date: 2026-10-10
    fwd: 84.2
    coll: 9.8
    change: Bare metric_baseline trained for 10000 epochs instead of 4000.
    result: >-
      2 seeds 84.6 / 83.9 (collision 9.5 / 10.0) vs 82.1 +- 0.4 at 4000 epochs. 0-1 rejected epochs.
