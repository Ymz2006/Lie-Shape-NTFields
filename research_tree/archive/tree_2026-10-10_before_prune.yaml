    title: Rerun in torch 2.2.2 (pytorchserver image)
    status: dropped
    date: 2026-10-10
    change: Bare metric_baseline trained in the Dockerfile.server image (torch 2.2.2), as on the old machine.
    result: >-
      Stopped at epoch ~300-400 at the user's request (the old checkpoints will be
      copied over instead). Loss over epochs 100-200 matched the torch 2.4.1 seeds
      (2.90-2.95e-3 vs 2.89-2.91e-3).
    runs:
