  # ---------------------------------------------------------------- lie_metric_rnl
  - id: lie_metric_rnl
    title: Lie-group RNL on lie_metric (sqrtN), Eikonal-consistent speed
    status: win
    date: 2026-10-10
    fwd: 78.7
    coll: 16.0
    change: >-
      lie_metric (two_route, (sqrt(N)-1)^2) + relative normal loss on x0 with the
      Lie-group probes of RNL_Lie_Group_Probes.pdf (models/rnl.py make_probes,
      c = 0). Speed 'aniso': S_c(q) = Sc*(x0) / N_x0(grad tau(q)), the speed the
      anisotropic Eikonal pins (frozen metric at x0). Anchor S(x0) detached;
      threshold = the target field's own finite-difference slope along the probe
      ('analytic'); RNL gradient projected off the Eikonal gradient (PCGrad) and
      norm-capped at 2/3 of it ('grad' balance); epochs accepted on the Eikonal
      loss. eps 0.02, ramp 1000 -> 2500 (ramps the cap), 4000 epochs, continued
      from lie_metric rsqrtN s1 at epoch 1000. (--rnl-balance grad; the package
      default became value, see lie_metric_rnl.value.)
    result: >-
      6 seeds, each continuing lie_metric rsqrtN s1..s6 from epoch 1000 (plan_eval forward MPPI, standard 1k set):
      76.4 / 77.2 / 82.4 / 77.0 / 79.3 / 79.7 = 78.7 +- 2.3, collision 16.0 (lie_metric same seeds 67.4 +- 11.2,
      collision 27.8; metric_baseline 3 seeds 82.1 +- 0.4). Paired change +9.4 / -0.7 / +10.7 / +31.2 / +9.8 / +7.0
      (5 of 6 better); seed 4, which collapses without RNL (45.8, collision 52.9), plans at 77.0. Harder T sets
      (5-6 seeds): tight 64.3 (lie 53.7, metric 67.7), tight e2 57.8 (41.9 / 46.2), tight e3 57.0 (40.4 / 44.5),
      big angle 50.1 (42.1 / 34.2), rot-heavy 67.7 (59.1 / 79.9). Lshape3d_env3 92.1 (2 of 3 seeds; lie 90.0,
      metric 89.9); Ashape3d_env4 91.9 +- 1.9 (3 seeds; lie 89.6, metric 87.1). Eikonal loss equals the no-RNL
      run's; 0-1 rejected epochs per run.
    notes: |
      Mechanism (analysis/speed_probe in the scratchpad): the band slope does not get steeper (-9.8 vs -9.8 /
      -10.6 for no-RNL). What changes is the speed level near obstacles: median Eikonal residual at band points
      0.91-0.98 for every lie_metric seed (field faster than its target there) -> 1.00-1.06 with the RNL, on all
      three datasets. Not a global rescale: MPPI temperature x1.1 / x1.25 changes nothing, and uniformly scaled
      speed targets (lie_metric_rnl.ctrl.speed_scale) recover at most a few points.
      The package default is now --rnl-balance value (lie_metric_rnl.value: 82.3 on T, better on all 12 paired
      seeds); this node's gradient balance is the stall-proof setting that keeps lie_metric's Eikonal fit.
      Checks (scratchpad verify_rnl.py): PDF sec. 8 probe checklist passes at
      ~1e-15. Analytic thresholds vs. clearance recomputed at the probe poses:
      corr 0.94 (trans), 0.85 (Lie rot); the Lie rotation probe closes 0.73 of
      its step in true clearance vs. 0.45 for the coordinate probe. Constant
      rho is infeasible (needs S(probe) < 0) for 52% (trans) / 38% (rot) of
      band samples. On a 2-epoch-old field the RNL gradient is 56-70x the
      Eikonal one with cosine -0.6 to them: with the Shape-NTFields loss-value
      cap the accept / reject loop rejects forever (smoke test stalled at the
      7th RNL epoch).
    runs:
      - Experiments/3dshape_lie_metric_rnl/Tshape3d_env1_lie_rnl_A0
      - Experiments/3dshape_lie_metric_rnl/{Lshape3d_env3,Ashape3d_env4}_lie_rnl_A0_s{1,2,3}
      - results/compare/plan/*rnl_A0*
      - results/compare/lie_metric_rnl_report.html
    code: [models/lie_metric_rnl/, models/lie_metric_rnl/rnl_lie.py]

