# Experiment tree: the model variants the user chose to keep, one node per variant.
#
# EDIT ONLY WHEN THE USER EXPLICITLY ASKS. Claude must not add, edit or delete
# nodes on its own initiative (see CLAUDE.md). The full pre-prune tree is in
# research_tree/archive/tree_2026-10-10_before_prune.yaml.
#
# `python3 research_tree/render.py` validates this file and rebuilds tree.html
# (`--text` prints the tree in the terminal). To view it from a laptop, run
# `python3 research_tree/serve.py` on the server and follow the printed SSH tunnel.
#
# Nodes form a FLAT list; the tree comes from `parent`. Siblings are drawn in
# file order.
#
# Fields (only id, title, status are required):
#   id       unique slug. Convention: <package>.<short-name>[.<short-name>...]
#   parent   id of the node this variant changes. Omit for a root (one root per
#            tracked model package under models/).
#   title    short name shown on the card.
#   status   ref     reference / starting configuration
#            win     improvement worth keeping
#            mixed   no clear change, or helps some sets and hurts others
#            fail    worse than its parent / dead end
#            running training or evaluation in progress
#            idea    proposed, not run yet
#            dropped abandoned or never finished; no result
#   date     YYYY-MM-DD the run (or idea) started.
#   change   what differs from the parent, in one or two sentences.
#   fwd      headline number (see meta.metric). Leave out if not evaluated.
#   coll     collision % on the same test set.
#   result   other numbers: seeds, other test sets, other envs, probe variants.
#   notes    interpretation, hypotheses, caveats (multi-line ok).
#   runs     list of paths: Experiments/... run folders, results/... outputs.
#   code     files or packages that implement the variant.

meta:
  title: Model experiment tree
  metric: >-
    fwd = forward-MPPI success % on Tshape3d_env1, standard 1k test set
    (offset 0.02); coll = collision % on that set. 4000 epochs unless noted.
  reference: metric_baseline   # its fwd is drawn as a tick on every bar

nodes:

  # ---------------------------------------------------------------- metric_baseline
  - id: metric_baseline
    title: metric NTFields baseline (isotropic Eikonal)
    status: ref
    date: 2026-10-06
    change: >-
      Original metric NTFields: single-route network, isotropic Eikonal on the
      combined speed.npy, residual 1e-2*(sqrt(S|grad tau|)-1)^2. TD and normal
      losses switched off.
    fwd: 77.7
    coll: 13.0
    result: >-
      3 seeds 77.7 ± 1.5 (non-convergence 17.0). Lshape3d_env3 88.0,
      Ashape3d_env4 87.1 (1 seed each). Farthest-pair set only 33.8: fails
      mostly by not converging at long range. Rerun 2026-10-09 on the new
      machine (2 seeds): 82.1 / 80.3, suite mean of 8 sets 59.2 ± 1.7; strongest
      on rotation-heavy (82-87%), weakest on farthest / big angles (46 / 42% with
      twist-sampling MPPI) (Experiments/3dshape_metric_baseline/Tshape3d_env1_metric_baseline_s{1,2},
      results/compare/plan/metric_s{1,2}*). 2026-10-10 (plan_eval, standard sets): T s3 82.1 (3 seeds 82.1 +- 0.4);
      Lshape3d_env3 90.4 / 87.7 / 91.6, Ashape3d_env4 86.4 / 88.9 / 85.9
      (Experiments/3dshape_metric_baseline/{L,A}*_metric_baseline_s{1,2,3}, results/compare/plan/{L,A}*_metric_s*).
      T s4 / s5 = epoch-4000 checkpoints of the 10000-epoch runs (metric_baseline.e10k): 82.2 / 81.1, so 5 seeds
      81.9 +- 0.5, collision 11.3.
    notes: |
      tau(start, goal) rank-correlates with realised path cost at only 0.55 on
      the farthest pairs (lie 0.71), and tau(waypoint, goal) rises along 18% of
      executed steps there. Poor cost-to-go at long range.
    runs:
      - Experiments/3dshape_metric_baseline/Tshape3d_env1_metric_baseline
      - results/output_3d/Tshape3d_env1_metric_baseline_final
      - results/compare/summary.md
    code: [models/metric_baseline/]

  - id: metric_baseline.full
    parent: metric_baseline
    title: TD + normal losses on (original metric NTFields)
    status: mixed
    date: 2026-10-10
    fwd: 79.1
    coll: 16.9
    change: >-
      Both losses metric_baseline switches off are back at the original weights:
      TD loss 1e-3 and normal-alignment loss 1e-3 (--td-weight 1e-3
      --normal-weight 1e-3). Alpha stays 1.0 (1.025 NaNs on the 3-D shape speeds).
    result: >-
      plan_eval forward MPPI, 3 seeds each. Tshape3d_env1 78.3 / 82.6 / 76.5 = 79.1 +- 3.1, collision 16.9
      (bare 82.1 +- 0.4, collision 11.1); suite mean of 9 T sets 57.7 (bare 60.9); worse than bare on every
      T set. Lshape3d_env3 90.4 +- 3.7 (bare 89.9); Ashape3d_env4 88.5 +- 1.3 (bare 87.1), with its clearest
      gain on A's far tight sets (exp2 64.5 vs 59.2, exp3 62.3 vs 56.2). 0-5 rejected epochs per run.
      With 2 more T seeds (the epoch-4000 checkpoints of the 10000-epoch runs, same procedure since LR is
      fixed): 78.3 / 82.6 / 76.5 / 78.6 / 81.0 = 79.4 +- 2.4, collision 16.7 (bare 5 seeds 81.9 +- 0.5,
      collision 11.3); 9-set mean 58.3 (bare 61.0).
    notes: |
      The bare baseline in the lie_metric_rnl report is not handicapped on T-shape: restoring the original
      losses lowers it. The TD term is what hurts (metric_baseline.td); the normal term alone is neutral
      (metric_baseline.normal) and mostly cancels the TD damage when both are on. With both on, the
      Eikonal term itself fits worse (2.30e-3 vs 2.0e-3 at epoch ~1150). Checkpoint ValLoss is the total
      (Eikonal + normal + TD), about 4.7e-3 at epoch 1150 vs 2.0e-3 bare.
    runs:
      - Experiments/3dshape_metric_baseline/{T,L,A}*_metric_full_s{1,2,3}
      - results/compare/plan/metricfull_s*, results/compare/plan/{L,A}*_metricfull_s*
    code: [models/metric_baseline/model_function_metric.py, models/metric_baseline/model_train_metric.py, train/train_3dshape.py]

  # ---------------------------------------------------------------- lie_metric
  - id: lie_metric
    title: Anisotropic Eikonal + Lie rotation gradient (two_route)
    status: ref
    date: 2026-10-06
    change: >-
      N = sqrt(S_dist^2 |grad_v tau|^2 + S_angle^2 |grad_w tau|^2) per endpoint,
      rotation block = body-frame Lie gradient (lie_rot_grad), residual
      1e-2*(N-1)^2. two_route network.
    fwd: 39.6
    coll: 58.0
    result: >-
      Rerun 2026-10-08 (new machine, --residual N, 2 seeds): 37.0 / 36.3,
      collision 60.2; plan_eval suite mean of 8 sets 24.0
      (Experiments/3dshape_lie_metric/Tshape3d_env1_lie_metric_rN_s{1,2},
      results/compare/plan/lie_rN_s{1,2}).
    notes: |
      models/lie_metric in the repo is still this (N-1)^2 version.
      Across envs lie reads rotation ~2.6x too fast (median): the anisotropic
      loss only enforces rotational slowness along directions that contain
      rotation.
    runs:
      - Experiments/3dshape_lie_metric/Tshape3d_env1_lie_metric
      - results/output_3d/Tshape3d_env1_lie_metric_final
    code: [models/lie_metric/]

  - id: lie_metric.origarch
    parent: lie_metric
    title: Original (single-route) network
    status: win
    date: 2026-10-06
    change: --arch original instead of two_route.
    fwd: 71.3
    coll: 25.9
    result: >-
      3 seeds 71.4 ± 2.0. Lshape3d_env3 93.4 (metric 88.0), Ashape3d_env4 83.0
      (metric 87.1). Farthest pairs 40.3 vs metric 33.8; beats shape on every
      set in every env.
    notes: |
      Plans the most efficient paths: 6-25% less geodesic rotation and 7-23%
      less translation than metric on cases both solve. Costs combine in
      quadrature (p = 2.01), as the anisotropic equation implies.
    runs:
      - Experiments/3dshape_lie_metric/Tshape3d_env1_lie_metric_origarch
      - results/compare/summary.md

  - id: lie_metric.origarch.sqrt
    parent: lie_metric.origarch
    title: (sqrt(N)-1)^2 residual
    status: win
    date: 2026-10-07
    change: Residual (N-1)^2 -> (sqrt(N)-1)^2, nothing else changed.
    fwd: 81.5
    coll: 11.6
    result: The (N-1)^2 parent scored 72.7 in this same evaluation.
    runs: [results/sqrt_vs_baseline_tshape_env1]

  - id: lie_metric.sqrt
    parent: lie_metric
    title: (sqrt(N)-1)^2 residual
    status: win
    date: 2026-10-07
    change: Residual (N-1)^2 -> (sqrt(N)-1)^2, nothing else changed.
    fwd: 82.7
    coll: 10.4
    result: >-
      Best Tshape3d_env1 result so far. In the same evaluation the (N-1)^2
      parent scored 40.0 and the metric baseline's 3 seeds 76.3 / 78.1 / 80.8.
      Rerun 2026-10-08/09 via --residual sqrtN (new machine, 6 seeds): batched
      67.5 / 79.1 / 73.2 / 47.2 (s1-s4); plan_eval standard 67.0 / 77.9 / 71.7 /
      45.8 / 69.5 / 72.7 = 67.4 ± 11.2, suite mean of 8 sets 50.4 ± 7.6
      (Experiments/3dshape_lie_metric/Tshape3d_env1_lie_metric_rsqrtN_s1..6,
      results/compare/plan/lie_rsqrtN_s1..6). Seed 4 collapsed (collision 52%)
      with a normal free-space metric. Lshape3d_env3 88.4 / 92.0, Ashape3d_env4
      89.5 / 90.5 (plan_eval, 2 seeds each). Third seed 2026-10-10: Lshape3d_env3 90.4, Ashape3d_env4 88.8.
    notes: |
      (x-1)^2 barely pushes under-fit near-obstacle samples and harshly
      penalises over-steep far-field gradients, so the field went flat near
      obstacles and MPPI cut through them. Checkpoints were in a session
      scratchpad: not yet committed to models/lie_metric.
    runs: [results/sqrt_vs_baseline_tshape_env1]

  - id: lie_metric.sqrt.l1
    parent: lie_metric.sqrt
    title: "L1 block sum S_dist|grad_v| + S_angle|grad_w| = 1"
    status: mixed
    date: 2026-10-10
    change: >-
      Ellipse sqrt(S_dist^2 |grad_v tau|^2 + S_angle^2 |grad_w tau|^2) = 1 replaced by the block
      sum S_dist |grad_v tau| + S_angle |grad_w tau| = 1 (dual to the max cost
      dt = max(da/S_dist, db/S_angle)). Nothing else changed: two_route, Lie rotation gradient,
      (sqrt(N)-1)^2, Eikonal loss only, 4000 epochs. Run as
      --models metric_lie_rhombus --dual-p 1 (that package is lie_metric.sqrt with a p-norm residual).
    fwd: 71.0
    coll: 23.1
    result: >-
      plan_eval forward MPPI, standard 1k, 6 seeds: 62.6 / 46.0 / 75.4 / 78.6 / 81.5 / 81.9 =
      71.0 +- 14.2 (lie_metric.sqrt same evaluation 67.4 +- 11.2, metric_baseline 81.9 +- 0.5, 5 seeds).
      Mean of the 9-set T suite 55.9 +- 12.7 (lie 50.8 +- 7.4, metric 61.0 +- 1.0): +3 to +9 over lie
      on every T set (none significant, p > 0.2); vs metric +6 farthest, +11 big angles, but -16
      rotation-heavy (p = 0.009), -12 very tight (p = 0.05). Lshape3d_env3 5-set mean 70.5 +- 4.6
      (lie 73.5, metric 74.5; standard 89.7 vs 90.0 / 89.9). Ashape3d_env4 5-set mean 76.7 +- 3.3
      (lie 75.1, metric 70.8; standard 92.0 vs 89.6 / 87.1, p = 0.02 vs both). 3 seeds each on L / A.
    notes: |
      Seed instability is inherited from lie_metric.sqrt: seed 2 collapses (collision 49%) like lie s4.
      Free-space probe (tau of a combined translation+rotation step over the matched single-block
      tau; box 1, ellipse 1.41, rhombus 2): L1 1.56 (q 1.54), lie_metric.sqrt 1.65 (q 1.38),
      metric_baseline 1.47 (q 1.79). The field moves toward the box only slightly; the net's
      tau = 0.2 sum_groups softmax_16 |e0 - e1| is a sum-type norm and cannot reach a max-type
      one. Rotation becomes about 2x cheaper in free space than under lie_metric (rotation step
      matching a 0.02 translation step: 0.044 vs 0.025 turns). First attempt killed at epoch
      ~3270 by a server reboot (crashed_reboot_2026-10-10/); rerun from scratch.
    runs:
      - Experiments/3dshape_metric_lie_rhombus/Tshape3d_env1_rhombus_p1_s{1..6}
      - Experiments/3dshape_metric_lie_rhombus/{Lshape3d_env3,Ashape3d_env4}_rhombus_p1_s{1,2,3}
      - results/compare/plan/rhombus_p1_s{1..6}
      - results/compare/plan/{Lshape3d_env3,Ashape3d_env4}_rhombus_p1_s{1,2,3}
    code: [models/metric_lie_rhombus/model_function_metric.py, analysis/plan_eval.py]

  # ---------------------------------------------------------------- lie_metric_6s
  - id: lie_metric_6s
    title: Six per-axis speeds (diagonal metric)
    status: fail
    date: 2026-10-07
    change: >-
      metric_baseline network and trainer with
      sqrt(g^T diag(S_x^2, S_y^2, S_z^2, S_r1^2, S_r2^2, S_r3^2) g) = 1,
      g = (world dtau/dp, body Lie rotation gradient), mapped
      1e-2*(sqrt(N)-1)^2. Speeds = free travel along each world axis / free
      rotation about each body axis (speeds_6.npy).
    fwd: 17.3
    coll: 82.4
    result: >-
      824/1000 failures are collisions. Training loss is lower than the
      baseline's (6e-4 vs 1.8e-3), so the fit is fine.
    notes: |
      Hypothesis (unverified): in the band some axis is usually free (62% of x0
      samples have S_x saturated), so the residual is met by a free-space-sized
      gradient along that axis and near-obstacle samples no longer force a
      steep barrier. The diagonal metric also overstates approach speed
      (translation 1.23x, rotation 1.85x median).
    runs:
      - Experiments/3dshape_lie_metric_6s/Tshape3d_env1_lie_metric_6s
      - results/output_3d/Tshape3d_env1_lie_metric_6s
    code: [models/lie_metric_6s/, dataprocessing/preprocess_obj_6s.py]

  - id: lie_metric_6s.isoctrl
    parent: lie_metric_6s
    title: Isotropic control
    status: ref
    date: 2026-10-07
    change: Same code with speeds_6 = [S_dist x3, S_angle x3].
    fwd: 76.8
    coll: 12.7
    result: Matches metric_baseline, so the pipeline is sound and the drop comes from the per-axis speeds.

  - id: lie_metric_6s.cap
    parent: lie_metric_6s
    title: Cap S_i at k x isotropic speed
    status: idea
    change: >-
      Keep a proximity penalty by capping every per-axis speed at a multiple of
      the isotropic speed. Compare against isoctrl, not only the baseline.

  # ---------------------------------------------------------------- lie_metric_rnl
  - id: lie_metric_rnl
    title: Lie-group RNL on lie_metric (sqrtN), Eikonal-consistent speed
    status: win
    date: 2026-10-10
    fwd: 78.7
    coll: 16.0
    change: >-
      lie_metric (two_route, (sqrt(N)-1)^2) + relative normal loss on x0 with the
      Lie-group probes of RNL_Lie_Group_Probes.pdf (models/rnl.py make_probes,
      c = 0). Speed 'aniso': S_c(q) = Sc*(x0) / N_x0(grad tau(q)), the speed the
      anisotropic Eikonal pins (frozen metric at x0). Anchor S(x0) detached;
      threshold = the target field's own finite-difference slope along the probe
      ('analytic'); RNL gradient projected off the Eikonal gradient (PCGrad) and
      norm-capped at 2/3 of it ('grad' balance); epochs accepted on the Eikonal
      loss. eps 0.02, ramp 1000 -> 2500 (ramps the cap), 4000 epochs, continued
      from lie_metric rsqrtN s1 at epoch 1000. (--rnl-balance grad; the package
      default became value, see lie_metric_rnl.value.)
    result: >-
      6 seeds, each continuing lie_metric rsqrtN s1..s6 from epoch 1000 (plan_eval forward MPPI, standard 1k set):
      76.4 / 77.2 / 82.4 / 77.0 / 79.3 / 79.7 = 78.7 +- 2.3, collision 16.0 (lie_metric same seeds 67.4 +- 11.2,
      collision 27.8; metric_baseline 3 seeds 82.1 +- 0.4). Paired change +9.4 / -0.7 / +10.7 / +31.2 / +9.8 / +7.0
      (5 of 6 better); seed 4, which collapses without RNL (45.8, collision 52.9), plans at 77.0. Harder T sets
      (5-6 seeds): tight 64.3 (lie 53.7, metric 67.7), tight e2 57.8 (41.9 / 46.2), tight e3 57.0 (40.4 / 44.5),
      big angle 50.1 (42.1 / 34.2), rot-heavy 67.7 (59.1 / 79.9). Lshape3d_env3 92.1 (2 of 3 seeds; lie 90.0,
      metric 89.9); Ashape3d_env4 91.9 +- 1.9 (3 seeds; lie 89.6, metric 87.1). Eikonal loss equals the no-RNL
      run's; 0-1 rejected epochs per run.
    notes: |
      Mechanism (analysis/speed_probe in the scratchpad): the band slope does not get steeper (-9.8 vs -9.8 /
      -10.6 for no-RNL). What changes is the speed level near obstacles: median Eikonal residual at band points
      0.91-0.98 for every lie_metric seed (field faster than its target there) -> 1.00-1.06 with the RNL, on all
      three datasets. Not a global rescale: MPPI temperature x1.1 / x1.25 changes nothing, and uniformly scaled
      speed targets (lie_metric_rnl.ctrl.speed_scale) recover at most a few points.
      The package default is now --rnl-balance value (lie_metric_rnl.value: 82.3 on T, better on all 12 paired
      seeds); this node's gradient balance is the stall-proof setting that keeps lie_metric's Eikonal fit.
      Checks (scratchpad verify_rnl.py): PDF sec. 8 probe checklist passes at
      ~1e-15. Analytic thresholds vs. clearance recomputed at the probe poses:
      corr 0.94 (trans), 0.85 (Lie rot); the Lie rotation probe closes 0.73 of
      its step in true clearance vs. 0.45 for the coordinate probe. Constant
      rho is infeasible (needs S(probe) < 0) for 52% (trans) / 38% (rot) of
      band samples. On a 2-epoch-old field the RNL gradient is 56-70x the
      Eikonal one with cosine -0.6 to them: with the Shape-NTFields loss-value
      cap the accept / reject loop rejects forever (smoke test stalled at the
      7th RNL epoch).
    runs:
      - Experiments/3dshape_lie_metric_rnl/Tshape3d_env1_lie_rnl_A0
      - Experiments/3dshape_lie_metric_rnl/{Lshape3d_env3,Ashape3d_env4}_lie_rnl_A0_s{1,2,3}
      - results/compare/plan/*rnl_A0*
      - results/compare/lie_metric_rnl_report.html
    code: [models/lie_metric_rnl/, models/lie_metric_rnl/rnl_lie.py]

  - id: lie_metric_rnl.ctrl
    parent: lie_metric_rnl
    title: "No-RNL continuation control"
    status: ref
    fwd: 62.2
    coll: 32.3
    date: 2026-10-10
    change: >-
      lie_metric_rnl --rnl none continued from the same lie_metric s1 epoch-1000 checkpoint (two runs: ctrl_a, ctrl_b). Measures the spread from batch order alone.
    result: >-
      ctrl_a 64.6 (coll 29.8), ctrl_b 59.8 (34.7); the original lie_metric s1 run from the same epoch-1000 state scored 67.0. Three no-RNL continuations of one checkpoint: 63.8 +- 3.6, the reference for every s1-continued variant. MPPI temperature x1.1 / x1.25 on ctrl_a, ctrl_b, lie s1: 64.5/64.0, 60.0/59.9, 66.5/66.6 (no effect).
    notes: |
      fwd = mean of ctrl_a / ctrl_b. Median Eikonal residual N at band points 0.95: the no-RNL field is faster than its target near obstacles.
    runs:
      - Experiments/3dshape_lie_metric_rnl/Tshape3d_env1_lie_rnl_ctrl_a
      - Experiments/3dshape_lie_metric_rnl/Tshape3d_env1_lie_rnl_ctrl_b
      - results/compare/plan/rnl_ctrl_a
      - results/compare/plan/temp550_ctrl_a

  - id: lie_metric_rnl.value
    parent: lie_metric_rnl
    title: "Shape-NTFields loss-value cap"
    status: win
    fwd: 82.3
    coll: 15.1
    date: 2026-10-10
    change: >-
      --rnl-balance value: RNL loss capped at 2/3 of the Eikonal loss value, as in Shape-NTFields, instead of the gradient-level balance.
    result: >-
      6 seeds (each continuing lie_metric rsqrtN s1..s6 from epoch 1000): 79.5 / 87.5 / 82.2 / 86.7 / 79.4 / 78.7 =
      82.3 +- 3.9, collision 15.1 (metric_baseline 82.1, lie_metric 67.4, gradient-balanced root 78.7). Paired vs
      lie_metric +12.5 / +9.6 / +10.5 / +40.9 / +9.9 / +6.0; Lshape3d_env3 92.7 (+2.5 / +2.2 / +3.6), Ashape3d_env4
      94.7 (+4.3 / +4.5 / +6.4): better than lie_metric on all 12 paired seeds. Harder T sets: tight 68.2, tight e1
      66.8, e2 62.4, e3 61.2, big angle 56.0 (best of all models), rot-heavy 71.1 (metric 79.9). Rejected epochs
      2-17 per run; final Eikonal loss 25-40% above the gradient-balanced runs; paths 3-4% longer than lie_metric's
      (metric_baseline 5-9%). Smoke test with the RNL switched on in one epoch at epoch 30: rejected epoch 37 380
      times in 10 min and never got past it.
    notes: |
      Package default since 2026-10-10 (rnl_lie.DEFAULTS balance 'value'). It trades Eikonal fit and path length
      for clearance: median band residual 1.25-1.33 vs 1.00-1.06 with gradient balancing. Needs the ramp from a
      trained network; use --rnl-balance grad when the RNL must start early.
    runs:
      - Experiments/3dshape_lie_metric_rnl/Tshape3d_env1_lie_rnl_value
      - Experiments/3dshape_lie_metric_rnl/Tshape3d_env1_lie_rnl_value_s{2..6}
      - Experiments/3dshape_lie_metric_rnl/{Lshape3d_env3,Ashape3d_env4}_lie_rnl_value_s{1,2,3}
      - results/compare/plan/*rnl_value*

  - id: lie_metric_rnl.value.backoff
    parent: lie_metric_rnl.value
    title: "Loss-value cap + rejection backoff"
    status: mixed
    fwd: 75.5
    coll: 21.9
    date: 2026-10-10
    change: >-
      --rnl-balance value --rnl-backoff 0.5: RNL weight halved on every rejected epoch, regrown x1.05 per accepted one.
    result: >-
      Eikonal loss 2.45e-3 (+38%), 0 rejected epochs.
    notes: |
      The backoff removes stalls but not the Eikonal degradation.
    runs:
      - Experiments/3dshape_lie_metric_rnl/Tshape3d_env1_lie_rnl_val_bo

  - id: lie_metric_rnl.prior
    parent: lie_metric_rnl
    title: "Prior port (models/rnl.py settings) on sqrtN"
    status: fail
    fwd: 5.9
    coll: 66.0
    date: 2026-10-10
    change: >-
      Block speeds 1/|grad_v|, 1/|grad_w|, differentiated anchor, constant rho (-20/-6), loss-value cap, accept on total loss: the earlier lie_metric.rnl.*.sntf recipe with Lie probes, on the sqrtN base.
    result: >-
      Non-convergence 87.1. Eikonal loss 3.35e-3 (+90%); block translational slope -36 (target -20) but median N at band points 0.67.
    notes: |
      Reproduces the lie_metric.rnl.* failure on the sqrtN base: the differentiated anchor pushes S(x0) up against the Eikonal, the field gets 33% faster than its target near obstacles and the planner no longer converges.
    runs:
      - Experiments/3dshape_lie_metric_rnl/Tshape3d_env1_lie_rnl_prior

  - id: lie_metric_rnl.norm
    parent: lie_metric_rnl
    title: "Gradient norm cap without projection"
    status: mixed
    fwd: 71.5
    coll: 22.6
    date: 2026-10-10
    change: >-
      --rnl-balance norm: RNL gradient scaled to <= 2/3 |g_eik| but the conflicting component is kept.
    result: >-
      7 rejected epochs; Eikonal loss 1.87e-3. Norm caps 3 and 10 (no projection) were dropped at epoch ~1500: Eikonal loss 3x and slopes flatter (-3 vs -9).
    notes: |
      Keeping the conflicting component costs ~5 points against A0 at the same cap.
    runs:
      - Experiments/3dshape_lie_metric_rnl/Tshape3d_env1_lie_rnl_norm

  - id: lie_metric_rnl.block
    parent: lie_metric_rnl
    title: "Block speeds"
    status: mixed
    fwd: 74.4
